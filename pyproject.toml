[project]
name = "reply-gate"
version = "0.1.0"
description = "근거 없는 답변을 스스로 기각하는 이커머스 CS 답변 에이전트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.55",
    # 상한을 박는다: SQL 검증기가 sqlglot 의 AST 노드 구조에 직접 의존하므로 메이저
    # 업그레이드가 안전장치를 조용히 깨뜨릴 수 있다. 우회 시도 회귀 테스트가 방어선이지만,
    # 그 방어선이 도는 것은 여기서 허용한 버전에서다. 올릴 때는 실제로 돌려서 확인한다.
    "sqlglot>=25.30,<31",
    "anthropic>=0.120.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reply_gate"]

# ── 린트/포맷 ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ── 타입체크 ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# 증분 캐시는 기본 on — 반복 검증에서 캐시가 재사용된다.
incremental = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# ── 테스트 ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: Postgres가 필요한 통합 테스트 (docker compose로 DB 기동 필요)",
    "live: 실제 외부 API 키가 필요한 테스트 (기본 실행에서 제외)",
]
