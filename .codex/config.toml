# Codex 프로젝트 설정 — 이 저장소에서만 적용된다.
#
# 목적 하나뿐이다: **커밋된 라이브 실측 리포트의 사후 편집을 막는다.**
# Claude Code 쪽 `.claude/settings.json` 과 같은 스크립트를 부른다 — 규칙이 두 벌로
# 갈라지면 한쪽만 고쳐지고 다른 쪽이 조용히 뚫린다.
#
# 근거: CLAUDE.md / AGENTS.md "평가용으로 심은 장치를 제거하지 않는다",
#       docs/tracking/status.md "두 벌 다 사후 편집하지 않는다",
#       docs/tracking/findings.md 9번.
#
# ⚠️ Codex 의 PreToolUse 페이로드 스키마를 확인하지 못했다. 스크립트의 codex 경로는
#    도구 이름으로 분기하지 않고 페이로드 전문에서 잠긴 경로와 변경 신호를 함께 찾으며,
#    거부를 JSON 과 exit 2 양쪽으로 낸다. 실제로 막히는지 확인하는 법은 README 가 아니라
#    스크립트 머리 주석에 있다(RG_HOOK_DEBUG).

[features]
hooks = true

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.claude/hooks/protect-live-reports.sh" codex'
timeout = 10
statusMessage = "라이브 리포트 불변식 확인"

# 두 번째 겹 — 도구 실행 전 권한을 묻는 경로가 따로 있다면 거기서도 본다.
[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.claude/hooks/protect-live-reports.sh" codex'
timeout = 10
statusMessage = "라이브 리포트 불변식 확인"
