# Reply-Gate 로컬 개발 DB — Postgres + pgvector 컨테이너 1개 (spec "저장" 절).
#
# 사용:
#   docker compose up -d          # 기동 (healthy 까지 기다리려면 --wait)
#   uv run python -m scripts.seed_orders
#   uv run pytest -m db           # DB 통합 테스트
#   docker compose down           # 정지 (데이터 유지)
#   docker compose down -v        # 볼륨까지 삭제 → 다음 기동 때 init 스크립트 재실행
#
# 비밀은 이 파일에 없다. 값은 gitignore 된 `.env` 에서 온다 (compose 가 자동으로 읽는다).
# 프로젝트 이름·컨테이너 이름·볼륨 이름을 모두 고정한다 — 워크트리마다 디렉터리 이름이
# 달라도 항상 같은 스택 하나만 뜬다.
name: reply-gate

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: reply-gate-postgres
    restart: unless-stopped
    environment:
      # 컨테이너 superuser — 확장 설치와 계정 생성에만 쓴다.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER 를 .env 에 설정한다}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD 를 .env 에 설정한다}
      POSTGRES_DB: ${POSTGRES_DB:-reply_gate}
      # 아래 4개는 db/init/01_roles.sh 가 계정을 만들 때 읽는다.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-reply_gate_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD 를 .env 에 설정한다}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-reply_gate_ro}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?POSTGRES_RO_PASSWORD 를 .env 에 설정한다}
      # 한국어 데이터를 다루므로 UTF-8 을 명시한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 호스트 포트는 .env 의 POSTGRES_PORT (기본 5433 — 로컬 Postgres 5432 와 충돌 회피).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # 최초 기동 시 1회만 실행된다. 볼륨이 남아 있으면 다시 돌지 않는다.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - reply-gate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  reply-gate-pgdata:
    name: reply-gate-pgdata
